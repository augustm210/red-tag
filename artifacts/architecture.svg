      <stop offset="0" stop-color="#11100e"/><stop offset="1" stop-color="#24211c"/>
    </linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-opacity=".28"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#f04438"/>
    </marker>
    <style>
      .k{font:700 22px ui-monospace,monospace;letter-spacing:2px;fill:#f04438}.h{font:900 54px Inter,Arial,sans-serif;fill:#f3efe6}.s{font:24px Inter,Arial,sans-serif;fill:#bcb5aa}.box{fill:#f3efe6;stroke:#c8beae;stroke-width:2;rx:18;filter:url(#shadow)}.t{font:800 25px Inter,Arial,sans-serif;fill:#11100e}.ts{font:800 22px Inter,Arial,sans-serif;fill:#11100e}.d{font:19px Inter,Arial,sans-serif;fill:#655f55}.a{stroke:#f04438;stroke-width:5;fill:none;marker-end:url(#arrow)}.agent{fill:#fff8ef;stroke:#f04438;stroke-width:2;rx:12}.at{font:700 18px Inter,Arial,sans-serif;fill:#11100e}.proof{fill:#193d28;stroke:#54d579;stroke-width:2;rx:15}.pt{font:700 20px ui-monospace,monospace;fill:#bff7c9}
    </style>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="#ffffff" stroke-opacity=".045"/></pattern>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/><rect width="1600" height="1000" fill="url(#grid)"/>
